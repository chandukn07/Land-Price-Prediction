<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LandIQ | AI Land Price Prediction</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #f5f7ff;
    color: #172033;
}

/* NAVBAR */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 7%;
    background: rgba(13, 20, 45, 0.94);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.nav-logo {
    font-size: 29px;
    font-weight: 800;
    color: white;
}

.nav-logo span {
    color: #42e695;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    color: #dbe2ff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #42e695;
}

.nav-cta {
    background: linear-gradient(135deg, #42e695, #3bb2ff);
    color: #07101c;
    padding: 11px 20px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
}

/* HERO */

.hero {
    position: relative;
    overflow: hidden;
    min-height: 720px;
    padding: 100px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    color: white;

    background:
        radial-gradient(circle at 80% 20%, rgba(62,230,149,0.25), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(73,124,255,0.35), transparent 35%),
        linear-gradient(135deg, #07142f, #17265c 55%, #301d61);
}

.hero::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(66,230,149,0.08);
    top: -150px;
    right: -100px;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 680px;
}

.hero-eyebrow {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 30px;
    background: rgba(66,230,149,0.12);
    border: 1px solid rgba(66,230,149,0.4);
    color: #42e695;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(45px, 6vw, 78px);
    line-height: 1.05;
    letter-spacing: -3px;
    margin-bottom: 25px;
}

.hero h1 span {
    background: linear-gradient(90deg, #42e695, #3bb2ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-sub {
    color: #c5cdea;
    font-size: 17px;
    line-height: 1.8;
    max-width: 620px;
    margin-bottom: 35px;
}

.hero-actions {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn-primary,
.btn-outline {
    display: inline-block;
    padding: 15px 27px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s;
}

.btn-primary {
    color: #07101c;
    background: linear-gradient(135deg, #42e695, #3bb2ff);
    box-shadow: 0 10px 30px rgba(66,230,149,0.2);
}

.btn-primary:hover {
    transform: translateY(-3px);
}

.btn-outline {
    color: white;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.07);
}

.btn-outline:hover {
    background: rgba(255,255,255,0.14);
}

/* HERO CARD */

.hero-card {
    position: relative;
    z-index: 2;
    width: 390px;
    padding: 30px;
    border-radius: 25px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.25);
}

.hero-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.hero-card-title {
    font-size: 13px;
    color: #c7d0ee;
    font-weight: 600;
}

.live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #42e695;
    box-shadow: 0 0 15px #42e695;
}

.chart {
    height: 190px;
    display: flex;
    align-items: end;
    gap: 12px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(0,0,0,0.12);
}

.bar {
    flex: 1;
    border-radius: 8px 8px 3px 3px;
    background: linear-gradient(to top, #3bb2ff, #42e695);
    animation: rise 1.2s ease;
}

@keyframes rise {
    from {
        height: 0;
    }
}

.hero-card-value {
    margin-top: 25px;
    font-size: 27px;
    font-weight: 800;
    color: #42e695;
}

.hero-card-small {
    color: #b8c2df;
    font-size: 12px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    padding: 30px 7%;
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(30,50,100,0.05);
}

.stat-pill {
    text-align: center;
    padding: 18px;
    border-radius: 15px;
    background: linear-gradient(135deg,#f7fbff,#f4f2ff);
    border: 1px solid #e7e9f5;
}

.stat-num {
    font-size: 27px;
    font-weight: 800;
    background: linear-gradient(90deg,#3b55d9,#12a85a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.stat-label {
    color: #737b91;
    font-size: 12px;
    margin-top: 4px;
}

/* GENERAL */

section {
    padding: 95px 7%;
}

.section-heading {
    max-width: 720px;
    margin-bottom: 50px;
}

.section-heading span {
    color: #4b5ee8;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.section-heading h2 {
    font-size: 42px;
    line-height: 1.2;
    margin-top: 10px;
    margin-bottom: 15px;
}

.section-heading p {
    color: #70798f;
    font-size: 16px;
    line-height: 1.8;
}

/* HOW IT WORKS */

#how {
    background:
        radial-gradient(circle at 90% 10%, #e8fff2, transparent 30%),
        #f7f9ff;
}

.steps {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
}

.step {
    position: relative;
    padding: 32px;
    border-radius: 20px;
    background: white;
    border: 1px solid #e5e9f5;
    box-shadow: 0 15px 40px rgba(45,60,120,0.07);
    transition: 0.3s;
}

.step:hover {
    transform: translateY(-8px);
}

.step-number {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    color: white;
    font-weight: 800;
    background: linear-gradient(135deg,#4b5ee8,#8d4de8);
    margin-bottom: 22px;
}

.step h3 {
    margin-bottom: 10px;
    font-size: 19px;
}

.step p {
    color: #737b91;
    font-size: 14px;
    line-height: 1.7;
}

/* TECHNOLOGY */

.technology {
    color: white;
    background:
        radial-gradient(circle at 80% 20%, rgba(66,230,149,0.15), transparent 30%),
        linear-gradient(135deg,#091633,#24194d);
}

.technology .section-heading p {
    color: #bfc8e1;
}

.model-cards {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 25px;
}

.model-card {
    padding: 35px;
    border-radius: 20px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    transition: 0.3s;
}

.model-card:hover {
    transform: translateY(-6px);
    background: rgba(255,255,255,0.1);
}

.model-icon {
    font-size: 35px;
    margin-bottom: 15px;
}

.model-card h3 {
    color: #42e695;
    margin-bottom: 12px;
}

.model-card p {
    color: #c0c8dd;
    font-size: 14px;
    line-height: 1.8;
}

/* LOCATIONS */

#locations {
    background: #ffffff;
}

.locations {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 15px;
}

.location {
    padding: 20px 12px;
    border-radius: 14px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #36405b;
    background: linear-gradient(135deg,#f5f7ff,#ecfff4);
    border: 1px solid #e2e7f3;
    transition: 0.3s;
}

.location:hover {
    transform: translateY(-5px);
    border-color: #42c986;
    color: #238b58;
}

/* PREDICTION */

.prediction-section {
    background:
        radial-gradient(circle at 10% 20%, rgba(75,94,232,0.18), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(66,230,149,0.18), transparent 30%),
        linear-gradient(135deg,#eef2ff,#effff6);
}

.prediction-wrapper {
    max-width: 1100px;
    margin: auto;
}

.prediction-box {
    padding: 38px;
    border-radius: 25px;
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 25px 70px rgba(46,65,130,0.13);
}

.prediction-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 22px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field label {
    font-size: 13px;
    font-weight: 700;
    color: #343d57;
    margin-bottom: 8px;
}

.field input,
.field select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #dce1ed;
    background: #ffffff;
    font-family: 'Poppins',sans-serif;
    font-size: 13px;
    outline: none;
}

.field input:focus,
.field select:focus {
    border-color: #4b5ee8;
    box-shadow: 0 0 0 4px rgba(75,94,232,0.08);
}

.range-value {
    margin-top: 6px;
    font-size: 12px;
    color: #4b5ee8;
    font-weight: 700;
}

input[type="range"] {
    accent-color: #4b5ee8;
}

/* BUTTON */

.predict-button {
    width: 100%;
    margin-top: 30px;
    padding: 17px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Poppins',sans-serif;
    font-size: 15px;
    font-weight: 800;
